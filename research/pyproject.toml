[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "tianji-research"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1", "jsonschema>=4,<5"]
[project.scripts]
tianji-research = "tianji_research.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["tianji_research*"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
