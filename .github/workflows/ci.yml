name: TianJi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :android:core-domain:test :android:core-qimen:test :android:core-data:testDebugUnitTest :android:app:lintDebug :android:app:assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './research[test]'
      - run: python -m pytest research/tests -q
      - run: ruff check research/tianji_research research/tests
      - uses: actions/upload-artifact@v4
        with:
          name: TianJi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
