name: TianJi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :android:core-domain:test :android:core-qimen:test :android:core-data:testDebugUnitTest :android:app:lintDebug :android:app:assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './research[test]'
      - run: python -m pytest research/tests -q
      - run: ruff check research/tianji_research research/tests
      - name: Record APK identity and keep the public signing verifier
        run: |
          mkdir -p verification-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verification-tools/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > verification-tools/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TianJi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TianJi-verification
          path: |
            verification-tools/
            android/**/build/test-results/
            android/**/build/reports/lint-results-debug.*
  android16-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android 16 Room and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 720x1440
            adb shell wm density 320
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew :android:core-data:connectedDebugAndroidTest :android:app:connectedDebugAndroidTest; result=$?; adb pull /sdcard/Pictures/TianJiTests android16-screenshots; exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android16-device-evidence
          path: |
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
            android16-screenshots/
